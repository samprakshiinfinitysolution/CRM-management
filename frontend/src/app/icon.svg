<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="35%" stop-color="#4338ca" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Bevel & Border Ring Gradient -->
    <linearGradient id="lf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35" />
    </linearGradient>

    <!-- Symbol Foreground Gradient -->
    <linearGradient id="lf-symbol" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Flow Accent Stream Gradient -->
    <linearGradient id="lf-stream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="lf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Magic Animator - Kinetic Flow & Living Aura */
    @keyframes lf-breathe {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 4px 12px rgba(37, 99, 235, 0.45));
      }
      50% {
        transform: scale(1.025);
        filter: drop-shadow(0 8px 24px rgba(56, 189, 248, 0.75));
      }
    }

    @keyframes lf-pulse-aura {
      0%, 100% {
        r: 16px;
        opacity: 0.8;
      }
      50% {
        r: 28px;
        opacity: 0.15;
      }
    }

    @keyframes lf-spark-shimmer {
      0%, 100% {
        transform: scale(0.9) rotate(0deg);
        opacity: 0.75;
      }
      50% {
        transform: scale(1.25) rotate(25deg);
        opacity: 1;
      }
    }

    @keyframes lf-stream-flow {
      0% {
        stroke-dashoffset: 60;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    .anim-group {
      transform-origin: 256px 256px;
      animation: lf-breathe 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .anim-aura {
      transform-origin: 395px 145px;
      animation: lf-pulse-aura 3s ease-in-out infinite;
    }

    .anim-spark {
      transform-origin: 395px 145px;
      animation: lf-spark-shimmer 3s ease-in-out infinite;
    }

    .anim-stream {
      stroke-dasharray: 24 16;
      animation: lf-stream-flow 2.5s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .anim-group, .anim-aura, .anim-spark, .anim-stream {
        animation: none !important;
      }
    }
  </style>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" ry="128" fill="url(#lf-bg)" />
  <rect x="10" y="10" width="492" height="492" rx="118" ry="118" fill="none" stroke="url(#lf-border)" stroke-width="6" />

  <!-- Background radial subtle lighting -->
  <circle cx="256" cy="140" r="160" fill="#38bdf8" opacity="0.12" filter="url(#lf-glow)" />

  <g class="anim-group">
    <!-- Stream line connecting pipeline -->
    <path d="M 172 360 C 230 360, 260 255, 335 255" 
          fill="none" 
          stroke="url(#lf-stream)" 
          stroke-width="12" 
          stroke-linecap="round"
          class="anim-stream" 
          opacity="0.85" />

    <!-- L Backbone & Base (The "L") -->
    <!-- Vertical stem of L -->
    <path d="M 124 140 C 124 126.7, 134.7 116, 148 116 C 161.3 116, 172 126.7, 172 140 L 172 344 C 172 368.3, 191.7 388, 216 388 L 300 388 C 313.3 388, 324 398.7, 324 412 C 324 425.3, 313.3 436, 300 436 L 216 436 C 165.2 436, 124 394.8, 124 344 Z" 
          fill="url(#lf-symbol)" 
          filter="drop-shadow(0 6px 14px rgba(15, 23, 42, 0.4))" />

    <!-- Upper F Bar with Deal-Growth Apex (↗ Arrow) -->
    <!-- Horizontal top bar -->
    <path d="M 196 145 C 196 131.7, 206.7 121, 220 121 L 348 121 C 361.3 121, 372 131.7, 372 145 C 372 158.3, 361.3 169, 348 169 L 220 169 C 206.7 169, 196 158.3, 196 145 Z" 
          fill="url(#lf-symbol)" 
          filter="drop-shadow(0 4px 10px rgba(15, 23, 42, 0.35))" />

    <!-- Middle F Bar (Pipeline Stage Bar) -->
    <path d="M 196 255 C 196 241.7, 206.7 231, 220 231 L 308 231 C 321.3 231, 332 241.7, 332 255 C 332 268.3, 321.3 279, 308 279 L 220 279 C 206.7 279, 196 268.3, 196 255 Z" 
          fill="url(#lf-symbol)" 
          filter="drop-shadow(0 4px 10px rgba(15, 23, 42, 0.35))" />

    <!-- Pipeline Convergence Arrow Head (Apex at 395, 145) -->
    <path d="M 340 102 L 396 145 L 340 188 C 330 195.6, 315.6 189.5, 315.6 177 L 315.6 113 C 315.6 100.5, 330 94.4, 340 102 Z" 
          fill="#38bdf8" 
          filter="drop-shadow(0 2px 8px rgba(56, 189, 248, 0.6))" />

    <!-- Aura Beacon on Arrow Tip -->
    <circle cx="395" cy="145" r="16" fill="#38bdf8" class="anim-aura" />
    <circle cx="395" cy="145" r="7" fill="#ffffff" />

    <!-- Shimmer Spark Star -->
    <g class="anim-spark">
      <path d="M 395 125 Q 395 145 375 145 Q 395 145 395 165 Q 395 145 415 145 Q 395 145 395 125 Z" 
            fill="#ffffff" 
            opacity="0.95" />
    </g>

    <!-- Pipeline Touchpoint Nodes -->
    <circle cx="220" cy="255" r="8" fill="#38bdf8" />
    <circle cx="220" cy="255" r="4" fill="#ffffff" />
    
    <circle cx="308" cy="255" r="8" fill="#67e8f9" />
    <circle cx="308" cy="255" r="4" fill="#ffffff" />

    <circle cx="148" cy="140" r="7" fill="#ffffff" opacity="0.9" />
  </g>
</svg>